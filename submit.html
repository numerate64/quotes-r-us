<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit a Quote | Quotes-R-Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="brand-link" href="index.html" aria-label="Quotes-R-Us home">
          <span class="logo-mark" aria-hidden="true">“</span>
          <span>Quotes-R-Us</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="library.html">Library</a>
          <a href="admin.html">Admin</a>
          <a href="api.html">API</a>
        </nav>
      </header>

      <form id="quote-form" class="quote-form">
        <p class="eyebrow">Add your two cents</p><h1>Submit a quote</h1><p class="page-description">An overheard gem. A favorite line. Something worth remembering.</p>
        <label for="quote-text">Quote</label>
        <textarea id="quote-text" name="quote" rows="6" maxlength="500" required placeholder="The quote goes here"></textarea>

        <div class="form-grid">
          <div>
            <label for="quote-source">Author or source</label>
            <input id="quote-source" name="source" maxlength="80" placeholder="Optional">
          </div>
          <div>
            <label for="quote-tags">Tags</label>
            <input id="quote-tags" name="tags" maxlength="80" placeholder="work, life, funny">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit">Save quote</button>
        </div>
        <p id="form-status" class="status-note" role="status" aria-live="polite"></p>
      </form>
      <footer class="site-footer">Good words. Yours to keep. <span>Saved in this browser.</span></footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
